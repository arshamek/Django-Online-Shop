# Development stack for the Django backend only. The React frontend keeps its own dev setup
# (`npm run dev` / `bun dev` in the repository root) and is intentionally NOT containerised here.
#
#   cp .env.example .env        # then set MSSQL_SA_PASSWORD (and review the rest)
#   docker compose up --build
#   docker compose --profile monitoring up flower     # optional Celery dashboard
#
# Requires Docker Compose >= 2.24 (optional env_file). SQL Server runs as linux/amd64 (emulated on Apple Silicon).
name: maral-backend

x-backend: &backend
  image: maral-backend:dev # built once, by the `web` service below
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DB_HOST: sqlserver
    DB_PORT: "1433"
    DB_NAME: ${DB_NAME:-maral}
    DB_USER: sa
    DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
    DB_TRUST_SERVER_CERTIFICATE: "yes" # the dev container uses a self-signed certificate
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
  volumes:
    - .:/app
  restart: "no"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    # One-shot: create the database (if missing) and enable READ_COMMITTED_SNAPSHOT.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
      DB_NAME: ${DB_NAME:-maral}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q
        "IF DB_ID(N'$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME] COLLATE Latin1_General_100_CI_AS_SC;
        ALTER DATABASE [$$DB_NAME] SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE;"

  redis:
    image: redis:7.4-alpine
    # noeviction: the Celery broker lives here; evicting keys would silently drop queued tasks.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *backend
    build:
      context: .
      target: development
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: >
      celery -A config worker -l INFO -n worker@%h
      -Q default,imports,translations,pricing,notifications
      --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    <<: *backend
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  flower:
    <<: *backend
    profiles: ["monitoring"]
    command: celery -A config flower --port=5555
    ports:
      - "127.0.0.1:5555:5555" # loopback only: Flower has no authentication by default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:

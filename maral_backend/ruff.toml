line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "DJ008", "E501"]  # nullable CharFields are intentional; line length is left to `ruff format`

[lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]
"tests/*" = ["B018"]
